name: Staff permission tests
on:
  push:
    paths:
      - 'app/backend/permissions.py'
      - 'app/backend/main.py'
      - 'tests/test_permissions.py'
      - 'tests/test_rbac_api.py'
      - '.github/workflows/permission-tests.yml'
  pull_request:
    paths:
      - 'app/backend/permissions.py'
      - 'app/backend/main.py'
      - 'tests/test_permissions.py'
      - 'tests/test_rbac_api.py'
      - '.github/workflows/permission-tests.yml'
jobs:
  permissions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt httpx
      - name: Compile application
        run: python -m compileall -q app/backend
      - name: Run role matrix and HTTP session tests
        run: python -m unittest discover -s tests -p 'test_permissions.py' -v && python -m unittest discover -s tests -p 'test_rbac_api.py' -v
